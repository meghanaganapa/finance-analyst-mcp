name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests (include the evaluation regression gate and an MCP stdio smoke test)
        run: pytest -q
      - name: Evaluation report (offline; held-out, hard and safety sets are locked)
        run: python -m finance_analyst.evaluate --split all --no-write >> "$GITHUB_STEP_SUMMARY"
